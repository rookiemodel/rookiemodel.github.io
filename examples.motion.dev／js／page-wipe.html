<script type="module">
import { press, animateView } from 'motion'

const qs = (el, ctx=document) => ctx.querySelector(el)
const qsa = (el, ctx=document) => Array.from(ctx.querySelectorAll(el))
const selectColor = async (element, {currentTarget, pageX, pageY}) => {
    const update = () => {
        const color = currentTarget.getAttribute('data-color')
        qs('#color-picker').style.setProperty('--current-color', color)
        const selected = qs('#color-picker .selected')
        selected.classList.remove('selected')
        currentTarget.parentElement.classList.add('selected')
    }

    const from = `circle(0% at ${pageX}px ${pageY}px)`;
    const to = `circle(100% at ${pageX}px ${pageY}px)`;
    const animation = await animateView(update, {duration:0.4, ease:[0.28, 0.02, 0.1, 0.99],}).new(
        { clipPath: [from, to] },
        { duration: 0.6, ease: 'easeIn' }
    )
}

press('#color-picker button', (element, event) => {
    selectColor(element, event)
})

/* Array.from(qsa('button', qs('#color-picker')), element => {

</script>
